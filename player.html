<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>html,body,#player{width:100%;height:100%;margin:0;background:#000}</style>
</head>
<body>
  <div id="player"></div>
  <script>
    (() => {
      let player = null;
      let apiReady = false;
      let playerReady = false;
      let queued = null;
      let endedSent = false;

      function send(type, extra = {}) {
        window.parent.postMessage({ source: "mediahub-player", type, ...extra }, "*");
      }

      function reportYouTubeState(event) {
        const states = window.YT && YT.PlayerState;
        if (event.data === states.ENDED) {
          if (!endedSent) {
            endedSent = true;
            send("ended", { state: "stopped" });
          }
          return;
        }
        if (event.data === states.PLAYING) endedSent = false;
        const state = event.data === states.PLAYING ? "playing"
          : event.data === states.PAUSED ? "paused"
          : event.data === states.BUFFERING ? "loading"
          : "idle";
        send("state", { state });
      }

      function load(videoId, autoplay) {
        if (!apiReady || !videoId) return false;
        if (player && playerReady) {
          endedSent = false;
          if (autoplay) player.loadVideoById(videoId);
          else player.cueVideoById(videoId);
          return true;
        }
        if (player) {
          queued = { command: "load", videoId };
          return true;
        }
        player = new YT.Player("player", {
          videoId,
          playerVars: {
            autoplay: autoplay ? 1 : 0,
            controls: 1,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1,
            origin: location.origin
          },
          events: {
            onReady: () => {
              playerReady = true;
              send("ready");
              if (queued) { const next = queued; queued = null; command(next); }
            },
            onStateChange: reportYouTubeState,
            onError: event => send("error", { code: event.data }),
            onAutoplayBlocked: () => send("autoplay-blocked")
          }
        });
        return true;
      }

      function command(message) {
        if (!message || !message.command) return;
        if (message.command === "load") {
          if (!load(message.videoId, true)) queued = message;
          return;
        }
        if (!player) { queued = message; return; }
        if (message.command === "play") player.playVideo();
        if (message.command === "pause") player.pauseVideo();
        if (message.command === "stop") player.stopVideo();
        if (message.command === "setVolume") player.setVolume(Math.max(0, Math.min(100, Number(message.volume || 0) * 100)));
      }

      window.addEventListener("message", event => command(event.data));
      window.onYouTubeIframeAPIReady = () => {
        apiReady = true;
        if (queued) { const next = queued; queued = null; command(next); }
      };
      window.setInterval(() => {
        if (!playerReady || endedSent || typeof player.getDuration !== "function") return;
        const duration = Number(player.getDuration() || 0);
        const current = Number(player.getCurrentTime() || 0);
        if (duration > 1 && current >= duration - 0.5) {
          endedSent = true;
          send("ended", { state: "stopped", fallback: true });
        }
      }, 1000);
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
